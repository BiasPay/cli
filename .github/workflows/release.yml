name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}

jobs:
    verify:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$GITHUB_REF_NAME"

    build:
        needs: verify
        strategy:
            fail-fast: true
            matrix:
                include:
                    - { target: aarch64-apple-darwin, runner: macos-15, smoke: true }
                    # Cross-compiled on Apple silicon, so it isn't run.
                    - { target: x86_64-apple-darwin, runner: macos-15, smoke: false }
                    - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, smoke: true }
                    - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, smoke: true }
                    - { target: x86_64-pc-windows-msvc, runner: windows-2025, smoke: true }
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}
            # Static musl builds run on any Linux distribution. musl-gcc compiles ring's C.
            - if: contains(matrix.target, 'musl')
              run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
            - run: cargo build --release --locked --target ${{ matrix.target }}
              shell: bash
              env:
                  CC_aarch64_unknown_linux_musl: musl-gcc
                  CC_x86_64_unknown_linux_musl: musl-gcc
            - if: matrix.smoke
              shell: bash
              run: test "$(target/${{ matrix.target }}/release/bias version)" = "bias ${GITHUB_REF_NAME#v}"
            - if: runner.os != 'Windows'
              run: |
                  mkdir -p stage dist
                  cp target/${{ matrix.target }}/release/bias LICENSE README.md stage/
                  tar -C stage -czf dist/bias-${{ matrix.target }}.tar.gz bias LICENSE README.md
            - if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force dist | Out-Null
                  Compress-Archive -Path target/${{ matrix.target }}/release/bias.exe, LICENSE, README.md -DestinationPath dist/bias-${{ matrix.target }}.zip
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: bias-${{ matrix.target }}
                  path: dist/*
                  if-no-files-found: error

    # Archive names leave out the version, so releases/latest/download/<name> always works.
    release:
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: bias-*
                  merge-multiple: true
                  path: dist
            - working-directory: dist
              run: sha256sum bias-* > SHA256SUMS && cat SHA256SUMS
            - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: dist/bias-*
            - name: Publish the GitHub release
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    gh release upload "$GITHUB_REF_NAME" dist/* --clobber
                  else
                    gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes "$NOTES"
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  NOTES: |
                      Install with Homebrew, npm or the install script:

                      ```sh
                      brew install biaspay/tap/bias
                      npm install -g @biaspay/cli
                      curl -fsSL https://biaspay.com/docs/install.sh | sh
                      ```

                      Or download the archive for your platform below and check it against `SHA256SUMS`. Each archive has a build provenance attestation: `gh attestation verify <archive> --repo BiasPay/cli`.

    # Platform packages first, so @biaspay/cli never depends on a version that isn't out yet. A rerun
    # skips whatever is already published.
    npm:
        needs: release
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: bias-*
                  merge-multiple: true
                  path: dist
            - name: Unpack the binaries
              run: |
                  for archive in dist/bias-*.tar.gz; do
                    target=$(basename "$archive" .tar.gz); target=${target#bias-}
                    mkdir -p "binaries/$target" && tar -xzf "$archive" -C "binaries/$target" bias
                  done
                  for archive in dist/bias-*.zip; do
                    target=$(basename "$archive" .zip); target=${target#bias-}
                    mkdir -p "binaries/$target" && unzip -q "$archive" bias.exe -d "binaries/$target"
                  done
            # Trusted publishing, with no npm token: each package lists this repository's release.yml
            # as its trusted publisher.
            - name: Publish
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  node release/npm.mjs "$version" binaries "$RUNNER_TEMP/npm" > "$RUNNER_TEMP/packages"
                  while read -r dir; do
                    name=$(node -p "require(process.argv[1]).name" "$dir/package.json")
                    if npm view "$name@$version" version >/dev/null 2>&1; then
                      echo "$name@$version is already published"
                    else
                      npm publish "$dir" --provenance --access public
                    fi
                  done < "$RUNNER_TEMP/packages"

    homebrew:
        needs: release
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Update the formula in BiasPay/homebrew-tap
              run: |
                  test -n "$TAP_DEPLOY_KEY" || { echo "Set HOMEBREW_TAP_DEPLOY_KEY to a write deploy key for BiasPay/homebrew-tap." >&2; exit 1; }
                  gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
                  node release/formula.mjs "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/bias.rb"
                  ruby -c "$RUNNER_TEMP/bias.rb"
                  # GitHub's host keys from its API (over HTTPS), so the SSH connection is checked.
                  install -m 600 /dev/null "$RUNNER_TEMP/tap_key"
                  printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
                  curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
                  export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
                  git clone --quiet --depth 1 git@github.com:BiasPay/homebrew-tap.git "$RUNNER_TEMP/tap"
                  cd "$RUNNER_TEMP/tap"
                  mkdir -p Formula && cp "$RUNNER_TEMP/bias.rb" Formula/bias.rb
                  git add Formula/bias.rb
                  if git diff --cached --quiet; then
                    echo "The formula is already at ${GITHUB_REF_NAME}"
                    exit 0
                  fi
                  git -c user.name=Bias -c user.email=sdk@biaspay.com commit -q -m "bias ${GITHUB_REF_NAME#v}"
                  git push --quiet origin HEAD
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  # Private half of a deploy key with write access to BiasPay/homebrew-tap, and nothing else.
                  TAP_DEPLOY_KEY: "${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}"
